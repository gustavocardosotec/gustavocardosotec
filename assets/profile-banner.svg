<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430" role="img" aria-labelledby="title desc">
  <title id="title">GVC Dev — sites e sistemas web</title>
  <desc id="desc">Banner azul-marinho com detalhes dourados e a identidade GVC Dev.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1428"/>
      <stop offset="1" stop-color="#172747"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#ffad19"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1500" height="430" rx="30" fill="url(#bg)"/>
  <rect width="1500" height="430" rx="30" fill="url(#grid)"/>
  <circle cx="1375" cy="70" r="190" fill="#ffbd2e" opacity=".07"/>
  <circle cx="1260" cy="410" r="230" fill="#f04b20" opacity=".06"/>
  <path d="M0 355h520" stroke="url(#gold)" stroke-width="4" opacity=".9"/>
  <g transform="translate(92 112)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="m58 20-42 52 42 52" stroke="#f5f7fb" stroke-width="12"/>
    <path d="m205 20 42 52-42 52" stroke="#f5f7fb" stroke-width="12"/>
    <path d="M137 37c-31 0-49 20-49 44s18 44 49 44c25 0 42-15 45-36h-44" stroke="url(#gold)" stroke-width="14"/>
    <path d="M106 152h69" stroke="#f04b20" stroke-width="9"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="390" y="202" fill="#f7f8fb" font-size="76" font-weight="700" letter-spacing="-2">GVC <tspan fill="url(#gold)">Dev</tspan></text>
    <text x="394" y="258" fill="#c7d0df" font-size="27" letter-spacing="5">SITES E SISTEMAS WEB</text>
    <rect x="394" y="296" width="62" height="5" rx="2.5" fill="url(#gold)"/>
    <text x="474" y="305" fill="#e7ebf3" font-size="20">sites e ferramentas que nascem de necessidades reais</text>
  </g>
  <g fill="#ffbd2e" opacity=".8">
    <circle cx="1280" cy="165" r="5"/><circle cx="1310" cy="165" r="5"/><circle cx="1340" cy="165" r="5"/>
    <circle cx="1280" cy="195" r="5"/><circle cx="1310" cy="195" r="5"/><circle cx="1340" cy="195" r="5"/>
    <circle cx="1280" cy="225" r="5"/><circle cx="1310" cy="225" r="5"/><circle cx="1340" cy="225" r="5"/>
