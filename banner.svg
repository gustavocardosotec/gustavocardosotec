<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="GVC Dev - Sites e sistemas web" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#1E2C52"/>
    </pattern>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#FBB629" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FBB629" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111D35" stop-opacity="0"/>
      <stop offset="1" stop-color="#111D35" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="#111D35"/>
  <rect width="1280" height="340" fill="url(#dots)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>

  <!-- marca: < G > _ -->
  <g transform="translate(70,62) scale(0.37) translate(-90,-250)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="298,278 115,478 298,680" stroke="#FFFFFF" stroke-width="56"/>
    <polyline points="728,278 905,478 728,680" stroke="#FFFFFF" stroke-width="56"/>
    <path d="M599 420 A105 105 0 1 0 618 480 L525 480" stroke="#FBB629" stroke-width="62"/>
    <line x1="676" y1="764" x2="780" y2="764" stroke="#F4511E" stroke-width="32">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.55;0.95;1" dur="1.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- nome -->
  <g font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="440" y="178" font-size="92" font-weight="800" fill="#FFFFFF" letter-spacing="-1">GVC<tspan fill="#FBB629" dx="16">Dev</tspan></text>
    <text x="444" y="226" font-size="21" font-weight="700" fill="#E2E8F0" letter-spacing="7">SITES E SISTEMAS WEB</text>
    <rect x="444" y="252" width="56" height="5" rx="2.5" fill="#F4511E"/>
    <text x="444" y="294" font-size="17" font-weight="500" fill="#8FA0C4">Gustavo Vicente Cardoso, dev estudante</text>
  </g>

  <rect x="1000" width="280" height="340" fill="url(#fade)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
